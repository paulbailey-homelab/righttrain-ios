name: iOS Tests

on:
  workflow_dispatch:

jobs:
  xctest:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /Shutdown|Booted/ { print $2; exit }')"
          if [ -z "$udid" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run XCTest
        run: |
          xcodebuild \
            -project RightTrain.xcodeproj \
            -scheme RightTrain \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            test
