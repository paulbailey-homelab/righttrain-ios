name: iOS Tests

on:
  pull_request:
    branches:
      - main
      - testflight-internal
      - testflight
    paths:
      - "RightTrain/**"
      - "RightTrainLiveActivityExtension/**"
      - "RightTrainTests/**"
      - "RightTrain.xcodeproj/**"
      - ".github/workflows/ios-tests.yaml"
  workflow_dispatch:

# A newer push to the same PR makes the older run pointless, and macOS
# runner minutes are the expensive kind.
concurrency:
  group: ios-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  xctest:
    # The app targets iOS 26, so it needs an Xcode with that SDK.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /Shutdown|Booted/ { print $2; exit }')"
          if [ -z "$udid" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Get Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -s ' ' | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      # Build products only: there are no package dependencies to cache. The
      # key changes every run so each run saves what it built; the restore
      # key picks up the newest earlier build for the same Xcode. A miss
      # costs a full build, nothing worse. PRs can read the base branch's
      # caches, so the first run on a new branch is usually warm.
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: DerivedData
          key: deriveddata-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ github.sha }}
          restore-keys: |
            deriveddata-${{ runner.os }}-${{ steps.xcode.outputs.version }}-

      # Ad-hoc signed, not unsigned: the app uses the Keychain and CloudKit,
      # which need the entitlements an unsigned build drops. Serial, because
      # parallel clone simulators fail to launch the host app.
      - name: Run XCTest
        run: |
          set -o pipefail
          xcodebuild \
            -project RightTrain.xcodeproj \
            -scheme RightTrain \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/RightTrain.xcresult" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            DEVELOPMENT_TEAM= \
            test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RightTrain.xcresult
          path: ${{ runner.temp }}/RightTrain.xcresult
          retention-days: 7
